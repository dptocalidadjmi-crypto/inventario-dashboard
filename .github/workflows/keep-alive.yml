name: Keep dashboard awake

on:
  schedule:
    # Cada 4 horas — evita que Streamlit Cloud duerma la app por inactividad.
    # Nota: un curl simple NO cuenta como visita para Streamlit; hace falta
    # una sesion real de navegador (websocket), por eso usamos Playwright.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  visit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.0-noble
    steps:
      - name: Visitar la app con navegador real
        run: |
          python3 -m pip install --quiet playwright==1.49.0
          python3 - <<'EOF'
          import sys
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://inventario-dashboard-ah5mkft5rzgpejtxtyquin.streamlit.app/"
          MARCA = "Dashboard de Inventario"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=120_000)

              # Si la app esta hibernando, pulsar el boton de despertar
              try:
                  page.get_by_text("get this app back up").click(timeout=8_000)
                  print("app dormida: boton de despertar pulsado")
              except Exception:
                  print("sin boton de despertar (app ya activa)")

              # La app corre dentro de un iframe — buscar el titulo en TODOS
              # los frames, hasta 4 minutos (el despertar tarda ~1 min)
              deadline = time.time() + 240
              visible = False
              while time.time() < deadline and not visible:
                  for frame in page.frames:
                      try:
                          if MARCA in frame.inner_text("body"):
                              visible = True
                              break
                      except Exception:
                          pass
                  if not visible:
                      page.wait_for_timeout(5_000)

              if not visible:
                  print("ERROR: el dashboard no rendereo en 4 minutos")
                  browser.close()
                  sys.exit(1)

              print("dashboard renderizado correctamente")

              # Mantener la sesion abierta un momento para que cuente como visita
              page.wait_for_timeout(20_000)
              browser.close()

          print("visita completada")
          EOF

  anti-idle:
    # GitHub apaga los workflows programados tras 60 dias sin actividad en un
    # repo publico. Solo cuentan los COMMITS a la rama por defecto: los tags,
    # issues, PRs y las corridas de Actions NO reinician el contador, y los
    # commits en otras ramas tampoco.
    #
    # Si eso pasa, el job de arriba deja de correr y la app se vuelve a dormir
    # (paso justo eso el 2026-09-10, con el repo en el dia ~56).
    #
    # Este job mira cuantos dias lleva el ultimo commit y, solo si ya se acerca
    # al limite, empuja un commit de latido que pone el contador en cero.
    # Sale a ~9 commits al año. Cada uno provoca un redeploy en Streamlit Cloud,
    # que es seguro porque requirements.txt tiene las versiones fijadas.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hace falta el historial para leer la fecha del ultimo commit

      - name: Latido si el repo se acerca a los 60 dias
        env:
          UMBRAL_DIAS: "40"       # margen de 20 dias antes del limite de GitHub
        run: |
          set -euo pipefail

          ultimo=$(git log -1 --format=%ct)
          ahora=$(date +%s)
          dias=$(( (ahora - ultimo) / 86400 ))
          echo "Ultimo commit hace ${dias} dias (umbral ${UMBRAL_DIAS}, limite de GitHub 60)."

          if [ "${dias}" -lt "${UMBRAL_DIAS}" ]; then
            echo "Todavia hay margen: no hace falta latido."
            exit 0
          fi

          echo "Repo cerca del limite: enviando commit de latido."
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git commit -m "chore: latido anti-inactividad (evita que GitHub apague el keep-alive)"

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::Push rechazado. Revisa Settings -> Actions -> General ->"
            echo "::error::Workflow permissions -> 'Read and write permissions'."
            exit 1
          fi

          echo "Latido enviado: el contador de 60 dias vuelve a cero."
